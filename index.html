
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffc20a">
<title>じゃんけん！</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  font-family: -apple-system, BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
  background: #f5f5f5;
}

body {
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
}

.app {
  width: min(100vw, 430px);
  height: 100vh;
  height: 100dvh;
  min-height: 0;
  background: #ffc20a;
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}

.close {
  position: absolute;
  right: 18px;
  top: max(14px, env(safe-area-inset-top));
  color: #fff;
  font-size: 34px;
  font-weight: 200;
  line-height: 1;
  background: none;
  border: 0;
  z-index: 20;
  cursor: pointer;
}

.title {
  flex: 0 0 clamp(62px, 13dvh, 105px);
  display: flex;
  justify-content: center;
  align-items: flex-end;
  padding-bottom: 6px;
  color: #fff;
  font-size: clamp(27px, 7.8vw, 34px);
  font-weight: 900;
  letter-spacing: .06em;
  text-shadow: 0 2px 0 rgba(0,0,0,.04);
}

.stage {
  flex: 1;
  min-height: 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 0 10px clamp(4px, 1.5dvh, 12px);
  overflow: hidden;
}

.speech {
  flex: 0 0 auto;
  min-height: clamp(42px, 8.5dvh, 64px);
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: clamp(16px, 5.8vw, 28px);
  font-weight: 900;
  letter-spacing: .02em;
  transform: rotate(-3deg);
  text-shadow: 0 2px 0 rgba(0,0,0,.05);
  white-space: nowrap;
}

.character {
  width: min(62vw, 260px);
  height: clamp(135px, 34dvh, 250px);
  flex: 0 1 auto;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: clamp(0px, 1dvh, 8px) 0 clamp(0px, 1dvh, 10px);
  position: relative;
}

.piplup {
  width: 100%;
  height: 100%;
  object-fit: contain;
  transition: transform .25s ease, filter .25s ease;
  filter: drop-shadow(0 5px 0 rgba(0,0,0,.08));
}

.character.normal .piplup {
  animation: none;
}

.character.playing .piplup {
  animation: bounce .35s ease infinite;
}

.character.win .piplup {
  animation: happy .65s ease;
  filter: drop-shadow(0 5px 0 rgba(0,0,0,.08)) brightness(1.08);
}

.character.lose .piplup {
  animation: sad .75s ease;
  filter: drop-shadow(0 5px 0 rgba(0,0,0,.08)) brightness(.88);
}

.character.draw .piplup {
  animation: confused .6s ease;
}

.opponent {
  flex: 0 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin-top: 0;
  margin-bottom: clamp(2px, 1dvh, 8px);
}

.opponent-label {
  color: #fff;
  font-size: 14px;
  font-weight: 800;
  line-height: 1.2;
  margin-bottom: 3px;
  text-shadow: 0 2px 0 rgba(0,0,0,.08);
}

.opponent-hand {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  min-width: 140px;
  min-height: 42px;
  padding: 4px 13px;
  border-radius: 999px;
  background: rgba(255,255,255,.94);
  color: #5b3990;
  box-shadow: 0 3px 0 rgba(0,0,0,.12);
  font-size: 17px;
  font-weight: 900;
}

.opponent-hand .emoji {
  font-size: 29px;
  line-height: 1;
}

.opponent-hand.reveal {
  animation: opponentReveal .35s ease;
}

.result {
  flex: 0 0 auto;
  min-height: clamp(40px, 7.5dvh, 55px);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: clamp(21px, 6.3vw, 27px);
  font-weight: 900;
  text-align: center;
  line-height: 1.2;
  white-space: pre-line;
  text-shadow: 0 2px 0 rgba(0,0,0,.05);
}

.hands {
  display: flex;
  flex: 0 0 auto;
  gap: clamp(12px, 5vw, 22px);
  margin-top: clamp(2px, 1dvh, 8px);
}

.hand {
  width: clamp(60px, 19vw, 82px);
  height: clamp(60px, 19vw, 82px);
  border: 0;
  border-radius: 50%;
  background: #7441c7;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 0 rgba(65,24,123,.25);
  cursor: pointer;
  transition: transform .08s, filter .15s;
}

.hand:active {
  transform: scale(.91);
}

.hand[disabled] {
  filter: grayscale(1);
  opacity: .45;
}

.hand span {
  font-size: clamp(38px, 12vw, 51px);
  filter: drop-shadow(0 2px 0 rgba(0,0,0,.12));
}

.controls {
  flex: 0 0 clamp(58px, 11dvh, 92px);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}

.small {
  border: 0;
  border-radius: 999px;
  padding: 10px 18px;
  background: rgba(255,255,255,.92);
  color: #5b3990;
  font-size: 15px;
  font-weight: 800;
  box-shadow: 0 3px 0 rgba(0,0,0,.1);
  cursor: pointer;
}

.flash {
  animation: flash .25s ease;
}

@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

@keyframes happy {
  0%, 100% { transform: translateY(0) rotate(0) scale(1); }
  25% { transform: translateY(-18px) rotate(-5deg) scale(1.08); }
  50% { transform: translateY(-6px) rotate(5deg) scale(1.05); }
  75% { transform: translateY(-12px) rotate(-3deg) scale(1.06); }
}

@keyframes sad {
  0%, 100% { transform: translateY(0) rotate(0); }
  20%, 60% { transform: translateY(5px) rotate(-4deg); }
  40% { transform: translateY(8px) rotate(4deg); }
  80% { transform: translateY(7px) rotate(2deg); }
}

@keyframes confused {
  0%, 100% { transform: rotate(0); }
  20%, 60% { transform: rotate(-7deg); }
  40% { transform: rotate(7deg); }
  80% { transform: rotate(4deg); }
}

@keyframes opponentReveal {
  0% {
    transform: scale(.65) translateY(-8px);
    opacity: 0;
  }
  60% {
    transform: scale(1.12);
    opacity: 1;
  }
  100% {
    transform: scale(1);
    opacity: 1;
  }
}

@keyframes flash {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.12); }
}

/* 画面の高さが小さい端末 */
@media (max-height: 620px) {
  .title {
    flex-basis: 56px;
  }

  .speech {
    min-height: 36px;
  }

  .character {
    height: clamp(105px, 27dvh, 165px);
    width: min(48vw, 210px);
    margin: 0;
  }

  .opponent {
    margin-bottom: 2px;
  }

  .opponent-label {
    font-size: 12px;
  }

  .opponent-hand {
    min-height: 35px;
    font-size: 15px;
  }

  .opponent-hand .emoji {
    font-size: 24px;
  }

  .result {
    min-height: 34px;
    font-size: 21px;
  }

  .hands {
    margin-top: 2px;
  }

  .hand {
    width: 58px;
    height: 58px;
  }

  .hand span {
    font-size: 36px;
  }

  .controls {
    flex-basis: 50px;
  }

  .small {
    padding: 8px 15px;
  }
}

@media (min-width: 431px) {
  .app {
    box-shadow: 0 0 24px rgba(0,0,0,.12);
  }
}
</style>
</head>

<body>
<div class="app">

  <button class="close" aria-label="リセット" onclick="resetGame()">×</button>

  <div class="title">じゃんけん！</div>

  <section class="stage">

    <div class="speech" id="speech">じゃーん　けーん</div>

    <div class="character normal" id="character">
      <img class="piplup" id="piplup"
        src="./piplup-normal.png"
        alt="青いペンギン風キャラクター">
    </div>

    <div class="opponent" id="opponent">
      <div class="opponent-label">相手の手</div>
      <div class="opponent-hand" id="opponentHand">
        <span class="emoji">❔</span>
        <span id="opponentName">？？？</span>
      </div>
    </div>

    <div class="result" id="result">どれを出す？</div>

    <div class="hands" id="hands">
      <button class="hand" onclick="play('rock')" aria-label="グー">
        <span>✊</span>
      </button>
      <button class="hand" onclick="play('scissors')" aria-label="チョキ">
        <span>✌️</span>
      </button>
      <button class="hand" onclick="play('paper')" aria-label="パー">
        <span>🖐️</span>
      </button>
    </div>

  </section>

  <div class="controls">
    <button class="small" onclick="toggleSound()" id="soundBtn">🔊 音ON</button>
  </div>

</div>

<script>
const hands = {
  rock: "✊",
  scissors: "✌️",
  paper: "🖐️"
};

const names = {
  rock: "グー",
  scissors: "チョキ",
  paper: "パー"
};

const piplupImages = {
  normal: "./piplup-normal.png",
  win: "./piplup-win.png",
  lose: "./piplup-lose.png",
  draw: "./piplup-draw.png"
};

let sound = true;
let busy = false;
let audioContext = null;

/* 音声コンテキスト */
function getAudioContext() {
  if (!audioContext) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    audioContext = new AC();
  }

  if (audioContext.state === "suspended") {
    audioContext.resume();
  }

  return audioContext;
}

/* 効果音 */
function playTone(
  frequency,
  duration = 100,
  type = "sine",
  volume = 0.06,
  delay = 0
) {
  if (!sound) return;

  const ctx = getAudioContext();
  if (!ctx) return;

  const start = ctx.currentTime + delay;
  const oscillator = ctx.createOscillator();
  const gain = ctx.createGain();

  oscillator.type = type;
  oscillator.frequency.setValueAtTime(frequency, start);

  gain.gain.setValueAtTime(0.0001, start);
  gain.gain.exponentialRampToValueAtTime(volume, start + 0.015);
  gain.gain.exponentialRampToValueAtTime(
    0.0001,
    start + duration / 1000
  );

  oscillator.connect(gain);
  gain.connect(ctx.destination);

  oscillator.start(start);
  oscillator.stop(start + duration / 1000 + 0.02);
}

function playCountSound() {
  playTone(520, 100, "square", 0.035, 0);
  playTone(520, 100, "square", 0.035, 0.25);
  playTone(620, 140, "square", 0.05, 0.5);
}

function playPonSound() {
  playTone(880, 90, "square", 0.07, 0);
  playTone(1175, 150, "sine", 0.065, 0.06);
}

function playWinSound() {
  [[523, 0], [659, 0.12], [784, 0.24], [1047, 0.36]]
    .forEach(([frequency, delay], index) => {
      playTone(
        frequency,
        index === 3 ? 260 : 130,
        "sine",
        index === 3 ? 0.08 : 0.07,
        delay
      );
    });
}

function playLoseSound() {
  [[440, 0], [349, 0.18], [262, 0.36]]
    .forEach(([frequency, delay], index) => {
      playTone(
        frequency,
        index === 2 ? 280 : 180,
        "sawtooth",
        index === 2 ? 0.05 : 0.045,
        delay
      );
    });
}

function playDrawSound() {
  playTone(520, 130, "triangle", 0.065, 0);
  playTone(520, 130, "triangle", 0.065, 0.2);
}

/* CPUの手 */
function cpuChoice() {
  const choices = ["rock", "scissors", "paper"];
  return choices[Math.floor(Math.random() * choices.length)];
}

/* 勝敗判定 */
function judge(player, cpu) {
  if (player === cpu) return "draw";

  if (
    (player === "rock" && cpu === "scissors") ||
    (player === "scissors" && cpu === "paper") ||
    (player === "paper" && cpu === "rock")
  ) {
    return "win";
  }

  return "lose";
}

/* キャラクター画像切り替え */
function changePiplup(state) {
  const piplup = document.getElementById("piplup");

  piplup.src = piplupImages[state];

  piplup.alt = {
    normal: "青いペンギン風キャラクター",
    win: "喜んでいる青いペンギン風キャラクター",
    lose: "悲しそうな青いペンギン風キャラクター",
    draw: "困惑している青いペンギン風キャラクター"
  }[state];
}

/* 相手の手を表示 */
function showOpponentHand(cpu) {
  const opponentHand = document.getElementById("opponentHand");

  opponentHand.querySelector(".emoji").textContent = hands[cpu];
  document.getElementById("opponentName").textContent = names[cpu];

  opponentHand.classList.remove("reveal");
  void opponentHand.offsetWidth;
  opponentHand.classList.add("reveal");
}

/* 相手の手を隠す */
function hideOpponentHand() {
  const opponentHand = document.getElementById("opponentHand");

  opponentHand.classList.remove("reveal");
  opponentHand.querySelector(".emoji").textContent = "❔";
  document.getElementById("opponentName").textContent = "？？？";
}

function setButtonsDisabled(disabled) {
  document.querySelectorAll(".hand").forEach(button => {
    button.disabled = disabled;
  });
}

/* じゃんけん */
function play(player) {
  if (busy) return;

  busy = true;

  if (sound) getAudioContext();

  setButtonsDisabled(true);

  const character = document.getElementById("character");
  const speech = document.getElementById("speech");
  const result = document.getElementById("result");

  character.classList.remove(
    "normal", "win", "lose", "draw", "playing"
  );

  changePiplup("normal");
  hideOpponentHand();
  character.classList.add("playing");

  speech.textContent = "じゃーん　けーん";
  result.textContent = "";

  playCountSound();

  setTimeout(() => {
    if (!busy) return;

    speech.textContent = "ぽん！";
    playPonSound();
  }, 650);

  setTimeout(() => {
    if (!busy) return;

    const cpu = cpuChoice();
    const r = judge(player, cpu);

    character.classList.remove("playing");
    showOpponentHand(cpu);

    if (r === "win") {
      result.textContent = "あなたの勝ち！ 🎉";
      changePiplup("win");
      character.classList.add("win");
      playWinSound();
    } else if (r === "lose") {
      result.textContent = "あなたの負け…";
      changePiplup("lose");
      character.classList.add("lose");
      playLoseSound();
    } else {
      result.textContent = "あいこ！";
      changePiplup("draw");
      character.classList.add("draw");
      playDrawSound();
    }

    speech.textContent =
      `あなた：${names[player]}　相手：${names[cpu]}`;

    result.classList.remove("flash");
    void result.offsetWidth;
    result.classList.add("flash");

    setTimeout(() => {
      if (busy) {
        setButtonsDisabled(false);
        busy = false;
      }
    }, 450);

  }, 1000);
}

/* リセット */
function resetGame() {
  busy = false;

  setButtonsDisabled(false);

  const character = document.getElementById("character");

  character.classList.remove("win", "lose", "draw", "playing");
  character.classList.add("normal");

  changePiplup("normal");
  hideOpponentHand();

  document.getElementById("speech").textContent = "じゃーん　けーん";

  const result = document.getElementById("result");
  result.textContent = "どれを出す？";
  result.classList.remove("flash");
}

/* 音ON/OFF */
function toggleSound() {
  sound = !sound;

  document.getElementById("soundBtn").textContent =
    sound ? "🔊 音ON" : "🔇 音OFF";

  if (sound) getAudioContext();
}
</script>
</body>
</html>
